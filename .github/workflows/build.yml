name: Build OpenAcrobat EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "OpenAcrobat" --icon="icon.png" --add-data "icon.png;." main.py

      - name: Upload OpenAcrobat.exe
        uses: actions/upload-artifact@v4
        with:
          name: OpenAcrobat-Windows
          path: dist/OpenAcrobat.exe
