name: Build AnTech Reader APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-venv python3-dev python3-pil \
            git zip unzip openjdk-17-jdk patch gettext lbzip2 \
            autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Convert icon.png to valid 512x512 RGBA PNG
        run: |
          python3 -c "from PIL import Image; im = Image.open('icon.png').convert('RGBA').resize((512, 512)); im.save('icon.png', 'PNG')"

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Set up Python environment and Buildozer
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip wheel
          pip install "setuptools<70.0.0" "cython==0.29.36" buildozer

      - name: Build AnTech Reader APK
        run: |
          source venv/bin/activate
          yes | buildozer android debug

      - name: Upload AnTech Reader APK
        uses: actions/upload-artifact@v4
        with:
          name: AnTech-Reader-APK
          path: bin/*.apk
